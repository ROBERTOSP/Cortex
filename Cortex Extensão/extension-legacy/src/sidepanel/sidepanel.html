<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="sidepanel.css" />
    <title>Cortex</title>
  </head>
  <body>
    <div class="app">
      <div class="topbar">
        <div class="brand">Cortex</div>
        <div class="topbar-actions">
          <div id="tokenBalance" class="pill">Tokens: —</div>
          <button id="openLogin" class="ghost">Login</button>
          <button id="openPopup" class="ghost">Config</button>
        </div>
      </div>

      <div class="tabs">
        <button class="tab active" data-tab="hoje">Hoje</button>
        <button class="tab" data-tab="plano">Plano</button>
        <button class="tab" data-tab="notas">Notas</button>
        <button class="tab" data-tab="flashcards">Flashcards</button>
        <button class="tab" data-tab="ia">IA</button>
      </div>

      <div id="content" class="content"></div>
    </div>

    <template id="tplOnboarding">
      <div class="section">
        <div class="h1">Primeira configuração</div>
        <div class="p">Preencha rotina e prova para gerar seu cronograma.</div>

        <div class="grid">
          <div class="field">
            <div class="label">Cargo pretendido</div>
            <input id="jobTitle" type="text" placeholder="Ex.: Analista, Técnico..." />
          </div>

          <div class="field">
            <div class="label">Data da prova</div>
            <input id="examDate" type="date" />
          </div>

          <div class="field">
            <div class="label">Horas por dia</div>
            <input id="hoursPerDay" type="number" min="0" step="0.5" placeholder="Ex.: 2" />
          </div>

          <div class="field">
            <div class="label">Dias por semana</div>
            <input id="daysPerWeek" type="number" min="1" max="7" step="1" placeholder="Ex.: 6" />
          </div>
        </div>

        <div class="field">
          <div class="label">Edital (PDF opcional)</div>
          <input id="editalPdf" type="file" accept="application/pdf" />
        </div>

        <div class="actions">
          <button id="saveProfile">Salvar</button>
          <button id="generatePlan" class="secondary">Gerar cronograma</button>
        </div>

        <div id="onboardingStatus" class="status"></div>
      </div>
    </template>

    <template id="tplHoje">
      <div class="section">
        <div class="h1">Agora</div>
        <div id="hojeBody" class="p"></div>
        <div class="actions">
          <button id="btnGeneratePlan">Gerar/atualizar cronograma</button>
        </div>
      </div>
    </template>

    <template id="tplPlano">
      <div class="section">
        <div class="h1">Plano</div>
        <pre id="planJson" class="pre"></pre>
        <div class="actions">
          <button id="btnRegen" class="secondary">Regerar</button>
        </div>
      </div>
    </template>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
